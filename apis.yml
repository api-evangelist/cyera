aid: cyera
name: Cyera
description: >-
  Cyera is an AI-native data security company whose Data Security Posture
  Management (DSPM) platform discovers, classifies, and secures sensitive data
  across cloud service providers (AWS, GCP, Azure), SaaS applications, data
  warehouses, and on-premises stores using an agentless architecture that scans
  hundreds of petabytes without impacting performance. Cyera exposes a versioned
  REST API (api.cyera.io, with an EU region at api-eu.cyera.io) secured with
  OAuth 2.0 / OpenID Connect and short-lived JWT bearer tokens, a published
  Model Context Protocol server (Cyera MCP over DataPort, a per-customer managed
  Snowflake warehouse) for natural-language querying of data-security findings,
  and a SafeBase-powered trust center covering SOC 2, ISO 27001, PCI DSS, HIPAA,
  and GDPR. It was surfaced as a portfolio company of Lightspeed Venture
  Partners and enriched by the API Evangelist pipeline.
