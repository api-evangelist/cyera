description: >-
  Cyera MCP is an official Model Context Protocol server that lets any
  MCP-compatible AI client (Claude, Cursor, Microsoft Copilot, ChatGPT, custom
  agents) query Cyera's data-security intelligence in natural language. It sits
  in front of DataPort — a per-customer managed Snowflake warehouse that stores
  Cyera's discovery, classification, access-exposure and risk findings in a
  structured, queryable format. Agents translate natural-language questions into
  queries against the customer's DataPort dataset and receive structured
  insights for investigations, reporting, and triage. Cyera DataPort is also
  listed on the AWS Marketplace (AI Agents & Tools) and documented on the Natoma
  MCP platform. Exact server URL, transport bindings, and tool schemas are
  provisioned per customer / demo and are not published publicly.
capabilities:
- Query sensitive-data locations and classification insights
- Follow access paths and analyze exposure risk
- Retrieve discovery and risk findings for investigations and reporting
